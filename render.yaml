services:
  - type: web
    name: admincare-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    releaseCommand: sh scripts/render-release.sh
    startCommand: sh scripts/render-start.sh
    healthCheckPath: /status
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_DATABASE_ALLOW_RESET
        value: "true"
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "30"
      - key: SESSION_SECURE_COOKIE
        value: "true"
