services:
  - type: web
    name: admincare-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Destructive reset is intentionally limited to this DEMO_MODE SQLite service.
    releaseCommand: sh scripts/render-release.sh
    startCommand: sh scripts/render-start.sh
    healthCheckPath: /status
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      # Render serves the public service over HTTPS. Keep this explicit so
      # console-generated URLs use the canonical scheme as well.
      - key: APP_URL
        value: https://admincare-demo.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_DATABASE_ALLOW_RESET
        value: "true"
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "30"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SANCTUM_STATEFUL_DOMAINS
        value: admincare-demo.onrender.com
